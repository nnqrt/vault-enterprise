# /etc/nginx/conf.d/vault.conf
# (기존 nginx.conf의 http { ... } 안에 include되는 전용 설정)

limit_req_zone $binary_remote_addr zone=vault_login_limit:10m rate=5r/m;

upstream vault_enterprise_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    # 기존 443과 충돌을 피하려면 8443 사용 (별도 도메인이 있으면 443으로 변경 가능)
    listen       8443 ssl http2;
    server_name  _;   # 도메인 사용 시 vault.internal 등으로 변경

    # 자체 서명 인증서 경로 (없으면 아래 3번 명령으로 생성)
    ssl_certificate      /etc/nginx/ssl/vault.crt;
    ssl_certificate_key  /etc/nginx/ssl/vault.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    # 금융권 보안 헤더 (이 server 블록에만 적용되어 기존 서비스에 영향 없음)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;

    # 정적 SPA (index.html 위치)
    root  /opt/vault-enterprise/static;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 로그인 브루트포스 방어
    location = /api/auth/login {
        limit_req zone=vault_login_limit burst=3 nodelay;
        proxy_pass         http://vault_enterprise_api/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # 일반 API 프록시
    location /api/ {
        proxy_pass         http://vault_enterprise_api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # DB/소스 직접 접근 차단
    location ~ /\. { deny all; }
    location ~* \.(db|sqlite|py|pyc|log|conf|sh)$ { deny all; }
}